worker_processes 1;
events { worker_connections 1024; }

http {
    upstream backend_pool {
        server 10.7.0.238:3001;
        server 10.7.5.97:3002;
    }

    server {
        listen 8443 ssl;
        server_name app.technova.test;

        ssl_certificate /Users/prathapanianusha/cn-project/certs/app.technova.test.crt;
        ssl_certificate_key /Users/prathapanianusha/cn-project/certs/app.technova.test.key;

        location / {
            proxy_pass http://backend_pool;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
